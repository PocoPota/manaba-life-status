<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>manaba ステータス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>manaba ステータス</h1>
  <div class="info">
    <p><strong>最終アクセス日時:</strong> <span id="lastAccess">読み込み中...</span></p>
    <p><strong>ホスト:</strong> <span id="host">読み込み中...</span></p>
  </div>

  <div class="uptime-section">
    <h2>過去365日間のUptime</h2>
    <div class="uptime-stats">
      <strong>Uptime:</strong> <span id="uptimePercent">計算中...</span>
    </div>
    <div class="uptime-container">
      <div class="uptime-labels">
        <div class="uptime-label">月</div>
        <div class="uptime-label"></div>
        <div class="uptime-label">水</div>
        <div class="uptime-label"></div>
        <div class="uptime-label">金</div>
        <div class="uptime-label"></div>
        <div class="uptime-label"></div>
      </div>
      <div class="uptime-bar" id="uptimeBar">
        読み込み中...
      </div>
    </div>
    <div class="uptime-legend">
      <span>少ない</span>
      <div class="legend-box" style="background-color: #ebedf0;"></div>
      <div class="legend-box" style="background-color: #9be9a8;"></div>
      <div class="legend-box" style="background-color: #40c463;"></div>
      <div class="legend-box" style="background-color: #30a14e;"></div>
      <div class="legend-box" style="background-color: #216e39;"></div>
      <span>多い</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
