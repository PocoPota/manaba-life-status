name: Update Status

on:
  # API経由でトリガー
  repository_dispatch:
    types: [update-status]

  # 手動実行用（テスト用）
  workflow_dispatch:
    inputs:
      timestamp:
        description: 'Unixタイムスタンプ（ミリ秒）'
        required: true
        type: string
      host:
        description: 'ホスト名（例: manaba.tsukuba.ac.jp）'
        required: true
        type: string

jobs:
  update-logs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run logger
        env:
          TIMESTAMP: ${{ github.event.inputs.timestamp || github.event.client_payload.timestamp }}
          HOST: ${{ github.event.inputs.host || github.event.client_payload.host }}
        run: node scripts/logger.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json logs/ heatmaps/
          git diff --staged --quiet || git commit -m "Update status data [skip ci]"
          git push
